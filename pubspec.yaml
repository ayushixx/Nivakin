name: nivakin
description: "Nivakin — Privacy-first, non-diagnostic adolescent health companion for young girls."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Official Google GenAI SDK
  google_generative_ai: ^0.4.7

  # Typography & Design
  google_fonts: ^6.2.1

  # State Management
  provider: ^6.1.2

  # Animations
  flutter_animate: ^4.5.0

  # Icons
  cupertino_icons: ^1.0.8

  # Sharing & Export
  share_plus: ^10.1.4

  # URL launcher for emergency calls
  url_launcher: ^6.3.1

  # Internationalization
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
    - assets/ncert/
